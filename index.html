<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ハノイの塔とテッセレーションを楽しめる数学の遊び場です。">
  <meta name="theme-color" content="#fff8e7">
  <title>数学の遊び場</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #263449;
      --muted: #5d6b7f;
      --paper: rgba(255, 255, 255, 0.9);
      --hanoi: #ff7a59;
      --hanoi-dark: #d94c30;
      --tessellation: #3488d8;
      --tessellation-dark: #1765ad;
      --focus: #1f57c3;
      --shadow: 0 16px 34px rgba(55, 66, 94, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      color: var(--ink);
      font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
      background:
        radial-gradient(circle at 10% 15%, rgba(255, 203, 92, 0.42) 0 9%, transparent 9.5%),
        radial-gradient(circle at 90% 12%, rgba(98, 212, 190, 0.3) 0 10%, transparent 10.5%),
        radial-gradient(circle at 88% 88%, rgba(109, 164, 255, 0.24) 0 12%, transparent 12.5%),
        linear-gradient(145deg, #fff8e7 0%, #effcf8 50%, #edf5ff 100%);
    }

    .page {
      width: min(100% - 32px, 940px);
      margin-inline: auto;
      padding: clamp(38px, 7vw, 76px) 0 40px;
    }

    header {
      text-align: center;
      margin-bottom: clamp(30px, 5vw, 48px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
      padding: 7px 14px;
      border: 1px solid rgba(50, 121, 116, 0.18);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.68);
      color: #25746c;
      font-size: clamp(0.88rem, 2vw, 1rem);
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 7vw, 4.6rem);
      line-height: 1.12;
      letter-spacing: 0.03em;
      text-wrap: balance;
    }

    .lead {
      margin: 16px auto 0;
      max-width: 660px;
      color: var(--muted);
      font-size: clamp(1rem, 2.4vw, 1.18rem);
      line-height: 1.8;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(18px, 3vw, 28px);
    }

    .card {
      position: relative;
      display: flex;
      min-height: 300px;
      flex-direction: column;
      align-items: flex-start;
      overflow: hidden;
      padding: clamp(24px, 4vw, 34px);
      border: 2px solid rgba(255, 255, 255, 0.82);
      border-radius: 28px;
      color: inherit;
      text-decoration: none;
      background: var(--paper);
      box-shadow: var(--shadow);
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .card::after {
      position: absolute;
      right: -42px;
      bottom: -58px;
      width: 178px;
      height: 178px;
      border-radius: 50%;
      background: var(--accent-soft);
      content: "";
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 22px 42px rgba(55, 66, 94, 0.2);
      border-color: var(--accent);
    }

    .card:active {
      transform: translateY(-1px) scale(0.99);
    }

    .card:focus-visible {
      outline: 4px solid var(--focus);
      outline-offset: 5px;
    }

    .hanoi {
      --accent: var(--hanoi);
      --accent-dark: var(--hanoi-dark);
      --accent-soft: rgba(255, 122, 89, 0.2);
    }

    .tessellation {
      --accent: var(--tessellation);
      --accent-dark: var(--tessellation-dark);
      --accent-soft: rgba(52, 136, 216, 0.18);
    }

    .icon {
      display: grid;
      width: 72px;
      height: 72px;
      margin-bottom: 22px;
      place-items: center;
      border-radius: 22px;
      background: var(--accent-soft);
      font-size: 2.25rem;
      line-height: 1;
    }

    .card h2 {
      margin: 0;
      font-size: clamp(1.55rem, 3.8vw, 2rem);
      line-height: 1.3;
    }

    .card p {
      margin: 10px 0 24px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
    }

    .button {
      position: relative;
      z-index: 1;
      display: inline-flex;
      min-height: 50px;
      margin-top: auto;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      border-radius: 15px;
      color: #fff;
      background: var(--accent-dark);
      font-weight: 800;
      letter-spacing: 0.03em;
    }

    .arrow {
      font-size: 1.25rem;
      transition: transform 180ms ease;
    }

    .card:hover .arrow {
      transform: translateX(4px);
    }

    footer {
      margin-top: 34px;
      color: var(--muted);
      text-align: center;
      font-size: 0.9rem;
    }

    @media (max-width: 680px) {
      .page {
        width: min(100% - 24px, 520px);
        padding-top: 30px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 250px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <p class="eyebrow">✦ 遊んで、気づいて、考えよう ✦</p>
      <h1>数学の遊び場</h1>
      <p class="lead">気になるゲームを選んで、数学のおもしろさを体験してみよう。</p>
    </header>

    <section class="cards" aria-label="数学ゲーム一覧">
      <a class="card hanoi" href="hanoi_3-12.html">
        <span class="icon" aria-hidden="true">🗼</span>
        <h2>ハノイの塔</h2>
        <p>円盤を動かして、最少の手数で塔を完成させよう。</p>
        <span class="button">ゲームを始める <span class="arrow" aria-hidden="true">→</span></span>
      </a>

      <a class="card tessellation"href="tessellation.html">
        <span class="icon" aria-hidden="true">🧩</span>
        <h2>テッセレーション</h2>
        <p>図形をすき間なく並べて、広がる模様を楽しもう。</p>
        <span class="button">ゲームを始める <span class="arrow" aria-hidden="true">→</span></span>
      </a>
    </section>

    <footer>Math Playground</footer>
  </main>
</body>
</html>
