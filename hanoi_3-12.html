<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ハノイの塔</title>
<style>
  :root{
    --bg:#f7f7f8;
    --panel:#ffffff;
    --text:#222;
    --muted:#666;
    --line:#d9d9df;
    --accent:#2f6fed;
    --disk:#eef3ff;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  .wrap{
    max-width:980px;
    margin:0 auto;
    padding:20px;
  }
  h1{
    font-size:clamp(24px,4vw,38px);
    margin:0 0 8px;
  }
  .sub{
    color:var(--muted);
    margin-bottom:18px;
  }
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
    margin-bottom:16px;
  }
  select,button{
    font:inherit;
    min-height:44px;
    border-radius:10px;
    border:1px solid var(--line);
    background:#fff;
    padding:8px 14px;
  }
  button{cursor:pointer}
  button:hover{border-color:#999}
  .stats{
    margin-left:auto;
    font-size:18px;
  }
  .board{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }
  .peg{
    position:relative;
    min-height:360px;
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    flex-direction:column;
    padding:52px 8px 24px;
    overflow:hidden;
    touch-action:manipulation;
  }
  .peg::before{
    content:"";
    position:absolute;
    bottom:24px;
    width:8px;
    height:265px;
    background:#b7b7bd;
    border-radius:8px 8px 0 0;
  }
  .base{
    position:absolute;
    left:7%;
    right:7%;
    bottom:18px;
    height:9px;
    border-radius:8px;
    background:#b7b7bd;
  }
  .label{
    position:absolute;
    top:14px;
    left:0;
    right:0;
    text-align:center;
    color:var(--muted);
    font-weight:600;
  }
  .stack{
    position:relative;
    z-index:2;
    width:100%;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    align-items:center;
  }
  .disk{
    height:22px;
    margin:2px 0;
    border:1px solid #b8c7ef;
    background:var(--disk);
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:700;
    user-select:none;
  }
  .selected{
    outline:4px solid var(--accent);
    outline-offset:2px;
  }
  .message{
    min-height:30px;
    margin-top:14px;
    font-weight:700;
  }
  .note{
    margin-top:18px;
    padding:14px 16px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#fff;
    color:var(--muted);
    line-height:1.7;
  }
  .reveal{
    margin-top:10px;
  }
  #minimumBox{
    margin-top:10px;
    font-weight:700;
  }
  @media(max-width:640px){
    .wrap{padding:12px}
    .board{gap:5px}
    .peg{min-height:300px;padding-left:3px;padding-right:3px}
    .peg::before{height:220px}
    .stats{width:100%;margin-left:0}
    .disk{height:20px;font-size:11px}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>ハノイの塔</h1>
  <div class="sub">左の塔にある円盤を、ルールを守って右の塔へすべて移そう。</div>

  <div class="controls">
    <label>
      円盤の枚数：
      <select id="diskCount">
        <option value="3">3枚</option>
        <option value="4" selected>4枚</option>
        <option value="5">5枚</option>
        <option value="6">6枚</option>
        <option value="7">7枚</option>
        <option value="8">8枚</option>
        <option value="9">9枚</option>
        <option value="10">10枚</option>
        <option value="11">11枚</option>
        <option value="12">12枚</option>
      </select>
    </label>
    <button id="resetBtn" type="button">最初から</button>
    <div class="stats">手数：<strong id="moves">0</strong></div>
  </div>

  <div class="board" id="board" aria-label="ハノイの塔"></div>

  <div class="message" id="message" aria-live="polite">円盤のある塔をタップし、次に移動先の塔をタップしてください。</div>

  <div class="note">
    <strong>ルール</strong><br>
    ① 1回に動かせる円盤は1枚だけ。<br>
    ② 小さい円盤の上に、大きい円盤を置くことはできません。<br>
    ③ すべての円盤を右の塔へ移せば完成です。
    <div class="reveal">
      <button id="revealBtn" type="button">最小手数を見る</button>
      <div id="minimumBox" hidden></div>
    </div>
  </div>
</div>

<script>
(() => {
  const board = document.getElementById('board');
  const diskCount = document.getElementById('diskCount');
  const resetBtn = document.getElementById('resetBtn');
  const movesEl = document.getElementById('moves');
  const message = document.getElementById('message');
  const revealBtn = document.getElementById('revealBtn');
  const minimumBox = document.getElementById('minimumBox');

  let towers = [[], [], []];
  let selected = null;
  let moves = 0;
  let n = 4;

  function reset() {
    n = Math.max(3, Math.min(12, parseInt(diskCount.value, 10) || 4));
    towers = [[], [], []];
    for (let size = n; size >= 1; size--) towers[0].push(size);
    selected = null;
    moves = 0;
    movesEl.textContent = '0';
    minimumBox.hidden = true;
    minimumBox.textContent = '';
    revealBtn.textContent = '最小手数を見る';
    message.textContent = '円盤のある塔をタップし、次に移動先の塔をタップしてください。';
    render();
  }

  function render() {
    board.innerHTML = '';

    ['左', '中央', '右'].forEach((label, i) => {
      const peg = document.createElement('button');
      peg.type = 'button';
      peg.className = 'peg';
      peg.setAttribute('aria-label', label + 'の塔');

      if (selected === i) peg.classList.add('selected');

      const lab = document.createElement('div');
      lab.className = 'label';
      lab.textContent = label;
      peg.appendChild(lab);

      const base = document.createElement('div');
      base.className = 'base';
      peg.appendChild(base);

      const stack = document.createElement('div');
      stack.className = 'stack';

      [...towers[i]].reverse().forEach(size => {
        const disk = document.createElement('div');
        disk.className = 'disk';
        disk.style.width = (28 + size * (64 / n)) + '%';
        disk.textContent = size;
        stack.appendChild(disk);
      });

      peg.appendChild(stack);
      peg.addEventListener('click', () => handlePeg(i));
      board.appendChild(peg);
    });
  }

  function handlePeg(i) {
    if (selected === null) {
      if (towers[i].length === 0) {
        message.textContent = 'その塔には円盤がありません。';
        return;
      }
      selected = i;
      message.textContent = '移動先の塔を選んでください。';
      render();
      return;
    }

    if (selected === i) {
      selected = null;
      message.textContent = '選択を取り消しました。';
      render();
      return;
    }

    const disk = towers[selected][towers[selected].length - 1];
    const top = towers[i][towers[i].length - 1];

    if (top !== undefined && top < disk) {
      message.textContent = '大きい円盤を小さい円盤の上には置けません。';
      selected = null;
      render();
      return;
    }

    towers[selected].pop();
    towers[i].push(disk);
    moves++;
    movesEl.textContent = String(moves);
    selected = null;

    if (towers[2].length === n) {
      const min = Math.pow(2, n) - 1;
      if (moves === min) {
        message.textContent = '完成！しかも最小手数です！';
      } else {
        message.textContent = '完成！ ' + moves + '手でした。';
      }
    } else {
      message.textContent = '続けてください。';
    }

    render();
  }

  revealBtn.addEventListener('click', () => {
    if (minimumBox.hidden) {
      minimumBox.hidden = false;
      minimumBox.textContent = n + '枚の最小手数は ' + (Math.pow(2, n) - 1) + ' 手です。';
      revealBtn.textContent = '最小手数を隠す';
    } else {
      minimumBox.hidden = true;
      revealBtn.textContent = '最小手数を見る';
    }
  });

  resetBtn.addEventListener('click', reset);
  diskCount.addEventListener('change', reset);

  reset();
})();
</script>
</body>
</html>
